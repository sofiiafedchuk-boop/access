<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#ffd9bb">

<title>Gesture Control</title>

<style>
:root{
  --peach:#ffd9bb;
  --peach-2:#ffe5cf;
  --blue:#1767f2;
  --blue-dark:#0d50c9;
  --text:#111116;
  --muted:#77777c;
  --card:#fff;
  --border:#babcc1;
  --switch:#b4b4b7;
  --red:#ff2f3f;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#d8d8dc;

  color:var(--text);

  user-select:none;
  -webkit-font-smoothing:antialiased;
}

button{
  border:0;
  padding:0;

  font:inherit;

  cursor:pointer;
}

.app{
  position:relative;

  width:min(100vw,390px);
  height:min(100dvh,844px);

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #ffddc2 0%,
      #ffdbbd 56%,
      #ffd6b6 100%
    );

  isolation:isolate;
}

@media(min-width:520px){
  .app{
    border-radius:42px;

    box-shadow:
      0 32px 90px
      rgba(0,0,0,.27);

    border:
      1px solid
      rgba(255,255,255,.42);
  }
}

/* ==================================
   SCREENS
================================== */

.screen{
  position:absolute;

  inset:0;

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  transform:
    translateX(18px);

  transition:
    opacity .28s ease,
    visibility .28s ease,
    transform .38s cubic-bezier(.2,.8,.2,1);
}

.screen.active{
  opacity:1;
  visibility:visible;

  pointer-events:auto;

  transform:none;
}

/* ==================================
   FIRST SCREEN
================================== */

.start-screen{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    calc(24px + env(safe-area-inset-top))
    25px
    calc(24px + env(safe-area-inset-bottom));
}

.start-buttons{
  width:100%;

  display:flex;
  flex-direction:column;

  gap:18px;
}

.main-choice{
  position:relative;

  width:100%;
  height:96px;

  display:flex;
  align-items:center;

  padding:0 22px;

  border-radius:25px;

  color:#16161a;

  background:
    rgba(255,255,255,.93);

  border:
    2px solid
    rgba(135,135,141,.34);

  box-shadow:
    0 12px 28px
    rgba(98,61,39,.12),

    inset
    0 2px 0
    rgba(255,255,255,.75);

  transition:
    transform .14s ease,
    box-shadow .18s ease;
}

.main-choice:active{
  transform:scale(.975);
}

.choice-icon{
  width:60px;
  height:60px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  margin-right:17px;

  border-radius:18px;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      #25262b,
      #101114
    );

  box-shadow:
    0 7px 16px
    rgba(0,0,0,.2);

  font-size:33px;
}

.choice-copy{
  flex:1;

  text-align:left;
}

.choice-copy strong{
  display:block;

  font-size:20px;
  font-weight:900;

  letter-spacing:-.035em;
}

.choice-arrow{
  color:#8c8c91;

  font-size:28px;
  font-weight:500;
}

/* ==================================
   HEADER
================================== */

.header{
  position:absolute;

  z-index:20;

  left:0;
  right:0;
  top:0;

  height:
    calc(
      80px +
      env(safe-area-inset-top)
    );

  padding:
    calc(
      18px +
      env(safe-area-inset-top)
    )
    18px
    10px;

  display:grid;

  grid-template-columns:
    48px
    1fr
    48px;

  align-items:center;
}

.back-button{
  width:46px;
  height:46px;

  display:grid;
  place-items:center;

  border-radius:16px;

  color:#151519;

  background:
    rgba(255,255,255,.16);

  font-size:32px;

  transition:
    transform .14s ease,
    background .2s ease;
}

.back-button:active{
  transform:scale(.9);
}

.page-title{
  text-align:center;

  font-size:24px;
  font-weight:950;

  letter-spacing:-.045em;
}

/* ==================================
   GESTURE PAGE
================================== */

.gesture-screen{
  padding:
    calc(
      94px +
      env(safe-area-inset-top)
    )
    25px
    calc(
      96px +
      env(safe-area-inset-bottom)
    );

  overflow-y:auto;

  scrollbar-width:none;
}

.gesture-screen::-webkit-scrollbar{
  display:none;
}

.gesture-list{
  display:flex;
  flex-direction:column;

  gap:15px;
}

/* ==================================
   CARD
================================== */

.gesture-card{
  position:relative;

  width:100%;
  min-height:72px;

  padding:
    7px
    18px
    7px
    8px;

  display:grid;

  grid-template-columns:
    58px
    1fr
    64px;

  gap:12px;

  align-items:center;

  overflow:hidden;

  border-radius:17px;

  color:#141418;

  background:#fff;

  border:
    2px solid
    #b9bbc0;

  box-shadow:
    0 5px 0
    rgba(105,105,110,.15),

    0 8px 17px
    rgba(95,61,45,.08);

  transition:
    transform .14s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.gesture-card:active{
  transform:scale(.988);
}

.gesture-card.enabled{
  border-color:
    rgba(23,103,242,.62);

  box-shadow:
    0 5px 0
    rgba(20,84,190,.12),

    0 8px 18px
    rgba(23,103,242,.12);
}

/* ==================================
   HAND
================================== */

.hand-box{
  width:56px;
  height:56px;

  display:grid;
  place-items:center;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #25262b,
      #0c0d10
    );

  box-shadow:
    0 5px 11px
    rgba(0,0,0,.20);

  font-size:37px;
  line-height:1;
}

.gesture-action{
  min-width:0;
}

.gesture-action strong{
  display:block;

  font-size:18px;
  font-weight:900;

  line-height:1.05;

  letter-spacing:-.035em;
}

.gesture-action span{
  display:block;

  margin-top:4px;

  color:#8b8b90;

  font-size:10px;
  font-weight:650;
}

/* ==================================
   SWITCH
================================== */

.switch{
  position:relative;

  width:60px;
  height:32px;

  padding:0;

  border-radius:999px;

  background:
    #b9b9bc;

  box-shadow:
    inset
    0 2px 5px
    rgba(0,0,0,.13);

  transition:
    background .25s ease,
    box-shadow .25s ease;
}

.switch-knob{
  position:absolute;

  left:4px;
  top:4px;

  width:24px;
  height:24px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.18);

  transition:
    transform .28s
    cubic-bezier(.25,.9,.25,1.15);
}

.switch.on{
  background:
    linear-gradient(
      145deg,
      #3f8cff,
      #1261e8
    );

  box-shadow:
    inset
    0 1px 3px
    rgba(0,0,0,.08),

    0 0 13px
    rgba(23,103,242,.2);
}

.switch.on
.switch-knob{
  transform:
    translateX(28px);
}

/* ==================================
   BOTTOM CTA
================================== */

.bottom-area{
  position:absolute;

  z-index:25;

  left:0;
  right:0;
  bottom:0;

  padding:
    13px
    26px
    calc(
      17px +
      env(safe-area-inset-bottom)
    );

  background:
    linear-gradient(
      180deg,
      rgba(255,216,184,0),
      rgba(255,216,184,.94) 30%,
      rgba(255,216,184,1)
    );
}

.insights-button{
  width:100%;
  height:55px;

  border-radius:17px;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #2374ff,
      #0b5ee8
    );

  border:
    2px solid
    #0649bd;

  box-shadow:
    0 6px 0
    #0845a6,

    0 11px 22px
    rgba(16,83,191,.2),

    inset
    0 2px 0
    rgba(255,255,255,.27);

  font-size:18px;
  font-weight:900;

  letter-spacing:-.02em;

  transition:
    transform .12s ease,
    box-shadow .12s ease;
}

.insights-button:active{
  transform:
    translateY(4px);

  box-shadow:
    0 2px 0
    #0845a6,

    0 6px 12px
    rgba(16,83,191,.15);
}

/* ==================================
   TAP SCREEN
================================== */

.tap-page{
  padding:
    calc(
      100px +
      env(safe-area-inset-top)
    )
    25px
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  display:flex;

  align-items:center;
  justify-content:center;
}

.tap-panel{
  width:100%;

  padding:28px 22px;

  border-radius:27px;

  background:#fff;

  border:
    2px solid
    #b9bbc0;

  text-align:center;

  box-shadow:
    0 7px 0
    rgba(105,105,110,.13);
}

.tap-hand{
  font-size:67px;
}

.tap-panel h2{
  margin:
    12px
    0
    8px;

  font-size:25px;
  font-weight:950;
}

.tap-panel p{
  margin:0;

  color:#77777d;

  font-size:13px;
  line-height:1.45;
}

/* ==================================
   SUCCESS
================================== */

.success-overlay{
  position:absolute;

  z-index:100;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:30px;

  opacity:0;
  visibility:hidden;

  background:
    rgba(255,215,184,.93);

  backdrop-filter:blur(11px);

  transition:
    opacity .3s ease,
    visibility .3s ease;
}

.success-overlay.visible{
  opacity:1;
  visibility:visible;
}

.success-card{
  width:100%;

  padding:30px 25px;

  border-radius:28px;

  text-align:center;

  background:#fff;

  border:
    2px solid
    #b8bbc0;

  box-shadow:
    0 15px 40px
    rgba(86,54,38,.15);

  transform:
    scale(.9);

  transition:
    transform .35s
    cubic-bezier(.2,1,.3,1);
}

.success-overlay.visible
.success-card{
  transform:scale(1);
}

.success-check{
  width:74px;
  height:74px;

  margin:
    0 auto
    17px;

  display:grid;
  place-items:center;

  border-radius:50%;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      #31d876,
      #16b85a
    );

  font-size:38px;
  font-weight:900;
}

.success-card h2{
  margin:
    0
    0
    8px;

  font-size:25px;
  font-weight:950;
}

.success-card p{
  margin:0;

  color:#77777d;

  font-size:13px;
}

.close-success{
  width:100%;
  height:50px;

  margin-top:21px;

  border-radius:15px;

  color:#fff;

  background:
    linear-gradient(
      #2374ff,
      #0b5ee8
    );

  font-size:16px;
  font-weight:850;
}

/* ==================================
   RED CLICK INDICATOR
================================== */

.tap-layer{
  position:absolute;

  z-index:9999;

  inset:0;

  overflow:hidden;

  pointer-events:none;
}

.tap-ripple{
  position:absolute;

  width:34px;
  height:34px;

  margin:
    -17px
    0
    0
    -17px;

  border-radius:50%;

  opacity:0;

  background:
    rgba(255,40,55,.28);

  border:
    3px solid
    rgba(255,27,44,.95);

  box-shadow:
    0 0 0 6px
    rgba(255,25,42,.13),

    0 0 24px
    rgba(255,20,40,.55);

  transform:
    scale(.3);

  pointer-events:none;
}

.click-flash{
  animation:
    elementFlash
    .52s
    ease;
}

@keyframes elementFlash{

  0%{
    filter:none;
  }

  22%{
    box-shadow:
      0 0 0 4px
      rgba(255,30,46,.46),

      0 0 24px
      rgba(255,30,46,.48);
  }

  100%{
    filter:none;
  }

}

/* ==================================
   SMALL HEIGHT
================================== */

@media(max-height:720px){

  .header{
    height:
      calc(
        68px +
        env(safe-area-inset-top)
      );

    padding-top:
      calc(
        10px +
        env(safe-area-inset-top)
      );
  }

  .gesture-screen{
    padding-top:
      calc(
        72px +
        env(safe-area-inset-top)
      );

    padding-bottom:
      calc(
        86px +
        env(safe-area-inset-bottom)
      );
  }

  .gesture-list{
    gap:9px;
  }

  .gesture-card{
    min-height:62px;

    grid-template-columns:
      50px
      1fr
      56px;

    padding:
      5px
      12px
      5px
      6px;
  }

  .hand-box{
    width:48px;
    height:48px;

    font-size:31px;
  }

  .gesture-action strong{
    font-size:16px;
  }

  .switch{
    width:55px;
    height:29px;
  }

  .switch-knob{
    width:21px;
    height:21px;
  }

  .switch.on
  .switch-knob{
    transform:
      translateX(26px);
  }

}
</style>
</head>

<body>

<div
  class="app"
  id="app"
>

  <!-- ====================================
       SCREEN 1
  ===================================== -->

  <section
    class="screen start-screen active"
    id="startScreen"
  >

    <div class="start-buttons">

      <button
        class="main-choice"
        id="tapControlButton"
        type="button"
      >

        <div class="choice-icon">
          👆
        </div>

        <div class="choice-copy">
          <strong>
            Control taps
          </strong>
        </div>

        <div class="choice-arrow">
          ›
        </div>

      </button>


      <button
        class="main-choice"
        id="gestureControlButton"
        type="button"
      >

        <div class="choice-icon">
          🤟
        </div>

        <div class="choice-copy">
          <strong>
            Control gestures
          </strong>
        </div>

        <div class="choice-arrow">
          ›
        </div>

      </button>

    </div>

  </section>


  <!-- ====================================
       GESTURES
  ===================================== -->

  <section
    class="screen"
    id="gestureScreen"
  >

    <header class="header">

      <button
        class="back-button"
        id="gestureBackButton"
        type="button"
      >
        ‹
      </button>

      <div class="page-title">
        Gesture
      </div>

      <div></div>

    </header>


    <main class="gesture-screen">

      <div
        class="gesture-list"
        id="gestureList"
      ></div>

    </main>


    <div class="bottom-area">

      <button
        class="insights-button"
        id="insightsButton"
        type="button"
      >
        Get insights
      </button>

    </div>

  </section>


  <!-- ====================================
       TAP CONTROL
  ===================================== -->

  <section
    class="screen"
    id="tapScreen"
  >

    <header class="header">

      <button
        class="back-button"
        id="tapBackButton"
        type="button"
      >
        ‹
      </button>

      <div class="page-title">
        Touch
      </div>

      <div></div>

    </header>

    <main class="tap-page">

      <div class="tap-panel">

        <div class="tap-hand">
          👆
        </div>

        <h2>
          Tap control
        </h2>

        <p>
          Touch actions can be configured here.
        </p>

      </div>

    </main>

  </section>


  <!-- ====================================
       SUCCESS
  ===================================== -->

  <div
    class="success-overlay"
    id="successOverlay"
  >

    <div class="success-card">

      <div class="success-check">
        ✓
      </div>

      <h2>
        Settings ready
      </h2>

      <p>
        Your selected gestures have been saved.
      </p>

      <button
        class="close-success"
        id="closeSuccess"
        type="button"
      >
        Done
      </button>

    </div>

  </div>


  <!-- TAP VISUALIZATION -->

  <div
    class="tap-layer"
    id="tapLayer"
  ></div>

</div>


<script>

/* ====================================
   DATA
==================================== */

const gestures = [

  {
    icon:"🤟",
    action:"Scroll up",
    description:"Move page upward"
  },

  {
    icon:"✊",
    action:"Scroll down",
    description:"Move page downward"
  },

  {
    icon:"✋",
    action:"Pause",
    description:"Pause current action"
  },

  {
    icon:"👍",
    action:"Select",
    description:"Choose highlighted item"
  },

  {
    icon:"👊",
    action:"Go back",
    description:"Return to previous screen"
  },

  {
    icon:"☝️",
    action:"Scroll",
    description:"Move through content"
  }

];


/* ====================================
   ELEMENTS
==================================== */

const startScreen =
  document.querySelector(
    "#startScreen"
  );

const gestureScreen =
  document.querySelector(
    "#gestureScreen"
  );

const tapScreen =
  document.querySelector(
    "#tapScreen"
  );

const gestureControlButton =
  document.querySelector(
    "#gestureControlButton"
  );

const tapControlButton =
  document.querySelector(
    "#tapControlButton"
  );

const gestureBackButton =
  document.querySelector(
    "#gestureBackButton"
  );

const tapBackButton =
  document.querySelector(
    "#tapBackButton"
  );

const gestureList =
  document.querySelector(
    "#gestureList"
  );

const insightsButton =
  document.querySelector(
    "#insightsButton"
  );

const successOverlay =
  document.querySelector(
    "#successOverlay"
  );

const closeSuccess =
  document.querySelector(
    "#closeSuccess"
  );

const tapLayer =
  document.querySelector(
    "#tapLayer"
  );

const app =
  document.querySelector(
    "#app"
  );


/* ====================================
   SCREENS
==================================== */

function showScreen(
  screen
){

  [
    startScreen,
    gestureScreen,
    tapScreen
  ]
  .forEach(
    item => {

      item.classList.remove(
        "active"
      );

    }
  );


  screen.classList.add(
    "active"
  );

}


gestureControlButton.addEventListener(
  "click",
  () => {

    showScreen(
      gestureScreen
    );

  }
);


tapControlButton.addEventListener(
  "click",
  () => {

    showScreen(
      tapScreen
    );

  }
);


gestureBackButton.addEventListener(
  "click",
  () => {

    showScreen(
      startScreen
    );

  }
);


tapBackButton.addEventListener(
  "click",
  () => {

    showScreen(
      startScreen
    );

  }
);


/* ====================================
   GESTURE CARDS
==================================== */

function renderGestures(){

  gestureList.innerHTML =
    "";


  gestures.forEach(
    (
      gesture,
      index
    ) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "gesture-card";


      card.innerHTML =
        `
          <div class="hand-box">
            ${gesture.icon}
          </div>

          <div class="gesture-action">

            <strong>
              ${gesture.action}
            </strong>

            <span>
              ${gesture.description}
            </span>

          </div>

          <button
            class="switch"
            type="button"
            aria-label="Toggle ${gesture.action}"
            data-index="${index}"
          >

            <span class="switch-knob"></span>

          </button>
        `;


      const toggle =
        card.querySelector(
          ".switch"
        );


      toggle.addEventListener(
        "click",
        event => {

          event.stopPropagation();


          toggle.classList.toggle(
            "on"
          );


          card.classList.toggle(
            "enabled",
            toggle.classList.contains(
              "on"
            )
          );

        }
      );


      card.addEventListener(
        "click",
        event => {

          if(
            event.target.closest(
              ".switch"
            )
          ){
            return;
          }


          toggle.click();

        }
      );


      gestureList.appendChild(
        card
      );

    }
  );

}


/* ====================================
   GET INSIGHTS
==================================== */

insightsButton.addEventListener(
  "click",
  () => {

    successOverlay.classList.add(
      "visible"
    );

  }
);


closeSuccess.addEventListener(
  "click",
  () => {

    successOverlay.classList.remove(
      "visible"
    );

  }
);


/* ====================================
   RED TAP VISUALIZATION
==================================== */

function showTap(
  event
){

  const rect =
    app.getBoundingClientRect();


  const x =
    event.clientX -
    rect.left;


  const y =
    event.clientY -
    rect.top;


  /*
    Only show inside
    the phone/app.
  */

  if(
    x < 0 ||
    y < 0 ||
    x > rect.width ||
    y > rect.height
  ){
    return;
  }


  const ripple =
    document.createElement(
      "div"
    );


  ripple.className =
    "tap-ripple";


  ripple.style.left =
    `${x}px`;


  ripple.style.top =
    `${y}px`;


  tapLayer.appendChild(
    ripple
  );


  const animation =
    ripple.animate(
      [
        {
          opacity:0,

          transform:
            "scale(.25)"
        },

        {
          opacity:1,

          transform:
            "scale(.75)",

          offset:.16
        },

        {
          opacity:.86,

          transform:
            "scale(1)",

          offset:.38
        },

        {
          opacity:0,

          transform:
            "scale(2.5)"
        }
      ],
      {
        duration:680,

        easing:
          "cubic-bezier(.15,.75,.25,1)",

        fill:
          "forwards"
      }
    );


  animation.onfinish =
    () => {

      ripple.remove();

    };


  /*
    Also flash the pressed
    interactive element.
  */

  const interactive =
    event.target.closest(
      "button,.gesture-card"
    );


  if(
    interactive
  ){

    interactive.classList.remove(
      "click-flash"
    );


    void interactive.offsetWidth;


    interactive.classList.add(
      "click-flash"
    );


    setTimeout(
      () => {

        interactive.classList.remove(
          "click-flash"
        );

      },
      540
    );

  }

}


/*
  Pointer down means the marker
  appears immediately at the exact
  moment of the tap.
*/

app.addEventListener(
  "pointerdown",
  showTap,
  {
    passive:true
  }
);


/* ====================================
   START
==================================== */

renderGestures();

</script>

</body>
</html>
